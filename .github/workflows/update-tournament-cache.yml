# Každý měsíc přidá turnaje z ITF Juniors: první běh stáhne 3 měsíce, další běhy přidají jeden měsíc.
# Stav se ukládá do cache (tournament-cache-state). Spouští se 1. v měsíci ve 3:00 UTC.

name: Update tournament cache (accumulate months)

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium dependencies (Puppeteer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 \
            libfontconfig1 libgcc1 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 \
            libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 \
            libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 \
            libdrm2 libgbm1 libatk-bridge2.0-0 \
            ca-certificates fonts-liberation xdg-utils wget

      - name: Restore tournament cache state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: tournament-cache-state

      - name: Prepare data dir
        run: mkdir -p data

      - name: Decide mode and set next month
        id: mode
        run: |
          if [ -f data/tournament-cache-state.json ]; then
            echo "mode=incremental" >> $GITHUB_OUTPUT
            NEXT=$(node scripts/get-next-calendar-month.js data/tournament-cache-state.json | sed 's/^NEXT_MONTH=//')
            echo "next_month=$NEXT" >> $GITHUB_OUTPUT
          else
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "next_month=" >> $GITHUB_OUTPUT
          fi

      - name: Full run – set 3 months (M1, M2, M3)
        if: steps.mode.outputs.mode == 'full'
        id: months
        run: |
          node -e "
          const d = new Date();
          const m1 = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
          d.setMonth(d.getMonth() + 1);
          const m2 = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
          d.setMonth(d.getMonth() + 1);
          const m3 = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
          console.log('M1=' + m1);
          console.log('M2=' + m2);
          console.log('M3=' + m3);
          " >> $GITHUB_ENV

      - name: Full run – fetch month 1
        if: steps.mode.outputs.mode == 'full'
        run: node scripts/fetch-calendar-itf-juniors.js "$M1"

      - name: Full run – merge baseline
        if: steps.mode.outputs.mode == 'full'
        run: cp data/tournament-cache.json data/all.json

      - name: Full run – fetch month 2
        if: steps.mode.outputs.mode == 'full'
        run: node scripts/fetch-calendar-itf-juniors.js "$M2"

      - name: Full run – merge month 2
        if: steps.mode.outputs.mode == 'full'
        run: node scripts/merge-tournament-cache.js data/all.json data/tournament-cache.json data/all.json

      - name: Full run – fetch month 3
        if: steps.mode.outputs.mode == 'full'
        run: node scripts/fetch-calendar-itf-juniors.js "$M3"

      - name: Full run – merge month 3 and finalize
        if: steps.mode.outputs.mode == 'full'
        run: |
          node scripts/merge-tournament-cache.js data/all.json data/tournament-cache.json data/all.json
          cp data/all.json data/tournament-cache.json
          cp data/all.json data/tournament-cache-state.json

      - name: Incremental run – fetch next month only
        if: steps.mode.outputs.mode == 'incremental'
        run: node scripts/fetch-calendar-itf-juniors.js "${{ steps.mode.outputs.next_month }}"

      - name: Incremental run – merge with state and finalize
        if: steps.mode.outputs.mode == 'incremental'
        run: |
          node scripts/merge-tournament-cache.js data/tournament-cache-state.json data/tournament-cache.json data/all.json
          cp data/all.json data/tournament-cache.json
          cp data/all.json data/tournament-cache-state.json

      - name: Import to Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/import-tournament-cache.js data/tournament-cache.json

      - name: Save tournament cache state to cache
        uses: actions/cache/save@v4
        with:
          path: data
          key: tournament-cache-state
